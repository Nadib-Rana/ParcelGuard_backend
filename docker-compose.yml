version: "3.9"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: nest_starter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nest_starter_db
    ports:
      - "5432:5432"
    volumes:
      - nest_postgres_data:/var/lib/postgresql/data
    networks:
      - nest_starter_network

  # MinIO Object Storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: nest_starter_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3 API Port
      - "9001:9001" # Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - nest_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nest_starter_network

  # Mailpit - Local Email Testing Server with Web UI
  mailpit:
    image: axllent/mailpit:latest
    container_name: nest_starter_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    networks:
      - nest_starter_network

networks:
  nest_starter_network:
    driver: bridge

volumes:
  nest_postgres_data:
    driver: local
  nest_minio_data:
    driver: local
